[project]
name = "backend"
version = "0.1.0"
description = "API платформы ФСП: профили, тест на грейд, подбор, приглашения и вакансии"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-reportlab>=4.4",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "venv*", ".venv*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 99
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # mccabe
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "PERF",   # perflint
    "TRY",    # tryceratops
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "EXE",    # flake8-executable
    "G",      # flake8-logging-format
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "NPY",    # NumPy-specific rules
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "YTT",    # flake8-2020
]
extend-ignore = [
    "PLR0913",  # Too many arguments
    "PLR0911",  # Too many return statements
    "PLR0915",  # Too many statements
    "RUF001",
    "RUF002",   # кириллица в docstring, как RUF001/RUF003 для строк и комментариев
    "RUF003",
    "B008",
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**/*" = [
    "S101",     # Use of assert
    "SLF001",   # Private member access
    "T201",     # print statements
    "PLR2004",  # Magic values are fine in test assertions against known fixture data
]


[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "type", "all"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
