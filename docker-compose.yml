name: fsp

# Наружу открыт только gateway. Остальные сервисы доступны лишь внутри сети compose.
services:
  gateway:
    restart: unless-stopped
    image: nginx:1.29-alpine
    volumes:
      - ./infra/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      BASE_PATH: ${BASE_PATH:-}
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
      - keycloak
      - mailpit

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        BASE_PATH: ${BASE_PATH:-}

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCORING_URL: http://scoring:8001
      PUBLIC_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # ФСП ID: по умолчанию mock-реалм fsp-id в нашем Keycloak. Для настоящего ФСП ID добавьте
      # сюда FSP_ID_PUBLIC_URL, FSP_ID_INTERNAL_URL, FSP_ID_REALM, FSP_ID_CLIENT_ID.
      FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET}
      # Вход жюри в песочницы без регистрации и экспресс-тест. Только для стенда проверки.
      DEMO_MODE: ${DEMO_MODE:-false}
      UPLOAD_DIR: /srv/data/uploads
      # Уведомления о приглашениях уходят в Mailpit и видны на /mail.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Бэк доступен только из сети compose: доверяем X-Forwarded-Proto от gateway (https-ссылки админки).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - uploads:/srv/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      scoring:
        condition: service_started

  scoring:
    restart: unless-stopped
    build: ./scoring

  keycloak:
    restart: unless-stopped
    image: keycloak/keycloak:26.8
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Браузер ходит в Keycloak через gateway по PUBLIC_URL/auth, бэк: напрямую по сети compose.
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Подставляются в infra/keycloak/realm-fsp.json при импорте.
      PUBLIC_URL: ${PUBLIC_URL}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/realm-fsp.json:/opt/keycloak/data/import/realm-fsp.json:ro
      # Mock ФСП ID: тестовые спортсмены athlete1-athlete4, пароль fsp-demo.
      - ./infra/keycloak/realm-fsp-id.json:/opt/keycloak/data/import/realm-fsp-id.json:ro
      - ./infra/keycloak/themes/fsp:/opt/keycloak/themes/fsp:ro
    healthcheck:
      # В образе нет curl: запрос к health через /dev/tcp. Проверяем код ответа: пока Keycloak не готов, будет 503.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Письма никуда не уходят: Mailpit их ловит и показывает на /mail.
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.31
    environment:
      MP_WEBROOT: ${BASE_PATH:-}/mail/
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}
      # Без этого Mailpit ищет обратную DNS-запись клиента и отвечает через 4 секунды:
      # на столько тормозили принятие приглашения и другие действия с письмом.
      MP_SMTP_DISABLE_RDNS: "true"

  postgres:
    restart: unless-stopped
    # Образ с pgvector: задел под эмбеддинги (docs/architecture.md); сейчас расширение не используется.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  uploads:
