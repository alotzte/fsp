# Раздача собранного SPA. Маршрутизация между сервисами — в infra/nginx/gateway.conf.template.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Сборка — сотни КБ JS: без сжатия первая загрузка в разы дольше. text/html сжимается всегда.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Хешированные файлы сборки не меняются — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Любые неизвестные пути отдаёт index.html, дальше разбирается react-router. no-cache: без него
    # браузер по эвристике держит старый index.html после деплоя и грузит удалённые файлы сборки.
    location / {
        add_header Cache-Control "no-cache";
        # Кабинеты не встраиваются во фреймы чужих сайтов (кликджекинг).
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
        try_files $uri /index.html;
    }
}
